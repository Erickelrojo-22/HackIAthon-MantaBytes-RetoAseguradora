services:
  - type: web
    name: fraudia-api
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn fraudia_claims.api:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FRAUDIA_DB_BACKEND
        value: postgres
      - key: FRAUDIA_DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: FRAUDIA_DATA_SOURCE
        value: demo
      - key: FRAUDIA_CORS_ORIGINS
        # IMPORTANTE: fraudia-frontend.onrender.com fue reclamado por OTRA cuenta de
        # Render (subdominios son first-come-first-served); ese hostname sirve una
        # aplicacion completamente distinta (titulo "fraudIA - Deteccion de fraude
        # con IA", bundle sin ninguna referencia a fraudia-api). Nuestro sitio
        # estatico quedo con el hostname auto-sufijado fraudia-frontend-r65k.onrender.com.
        # No listar el hostname ajeno aqui: no sirve para nada (nuestro frontend real
        # nunca envia requests desde ese origen) y no conviene confiar en un origen que
        # no controlamos. Si el hostname real de tu servicio fraudia-frontend cambia,
        # actualiza este valor para que coincida exactamente.
        value: https://fraudia-frontend-r65k.onrender.com
  - type: web
    name: fraudia-frontend
    runtime: static
    rootDir: frontend
    autoDeploy: true
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://fraudia-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
