services:
  - type: web
    name: fraudia-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn fraudia_claims.api:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FRAUDIA_DB_BACKEND
        value: postgres
      - key: FRAUDIA_DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: FRAUDIA_DATA_SOURCE
        value: company_synthetic
      - key: FRAUDIA_CORS_ORIGINS
        value: https://fraudia-frontend.onrender.com
  - type: web
    name: fraudia-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://fraudia-api.onrender.com
