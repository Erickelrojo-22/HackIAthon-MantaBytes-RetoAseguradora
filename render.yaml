services:
  - type: web
    name: fraudia-claims
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run src/fraudia_claims/app/main.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /
    envVars:
      - key: FRAUDIA_DB_BACKEND
        value: sqlite
      - key: FRAUDIA_DB_PATH
        value: data/processed/fraudia_claims.db
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: FRAUDIA_DATA_SOURCE
        value: demo
