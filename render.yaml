services:
  - type: web
    name: fraudia-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn fraudia_claims.api:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FRAUDIA_DB_BACKEND
        value: postgres
      - key: FRAUDIA_DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: FRAUDIA_DATA_SOURCE
        value: demo
      - key: FRAUDIA_CORS_ORIGINS
        # fraudia-frontend.onrender.com may already be claimed by another Render
        # account (the exact subdomain is first-come-first-served), in which case
        # this project's static site gets an auto-suffixed hostname instead (e.g.
        # fraudia-frontend-XXXX.onrender.com). List both so login/API calls don't
        # get silently CORS-blocked; update the suffixed one to match whatever
        # hostname your fraudia-frontend service actually gets assigned.
        value: https://fraudia-frontend.onrender.com,https://fraudia-frontend-r65k.onrender.com
  - type: web
    name: fraudia-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://fraudia-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
